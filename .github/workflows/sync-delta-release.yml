name: Sync Dedicated Delta Release

on:
  workflow_dispatch:
  push:
    branches:
      - fix/delta-stability
    paths:
      - '.delta/release-sync-trigger'

permissions:
  contents: write

concurrency:
  group: delta-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch source release metadata
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/tinhpr9/Aotscript/releases?per_page=100' \
            -o "$RUNNER_TEMP/aotscript-releases.json"

      - name: Select exact stable Delta asset
        id: select
        run: |
          set -euo pipefail
          python3 delta/release_selector.py "$RUNNER_TEMP/aotscript-releases.json" \
            > "$RUNNER_TEMP/selected-delta.json"
          python3 - "$RUNNER_TEMP/selected-delta.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          selected = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          output = pathlib.Path(sys.argv[2])
          fields = {
              'version': selected['version'],
              'tag': selected['dedicated_tag'],
              'asset_name': selected['asset_name'],
              'asset_url': selected['asset_url'],
              'asset_size': str(selected['asset_size']),
              'asset_sha256': selected['asset_sha256'],
              'source_release_url': selected['source_release_url'],
          }
          with output.open('a', encoding='utf-8') as handle:
              for key, value in fields.items():
                  if '\n' in value or '\r' in value:
                      raise SystemExit(f'unsafe output field: {key}')
                  handle.write(f'{key}={value}\n')
          PY

      - name: Download and verify source bytes
        env:
          ASSET_NAME: ${{ steps.select.outputs.asset_name }}
          ASSET_URL: ${{ steps.select.outputs.asset_url }}
          ASSET_SIZE: ${{ steps.select.outputs.asset_size }}
          ASSET_SHA256: ${{ steps.select.outputs.asset_sha256 }}
        run: |
          set -euo pipefail
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"
          curl -fL --retry 3 --connect-timeout 15 --output "$ASSET_PATH" "$ASSET_URL"
          python3 - "$ASSET_PATH" "$ASSET_SIZE" "$ASSET_SHA256" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          expected_size = int(sys.argv[2])
          expected_sha = sys.argv[3].lower()
          if not path.is_file() or path.stat().st_size != expected_size or expected_size <= 0:
              raise SystemExit('source Delta asset size mismatch')
          digest = hashlib.sha256()
          with path.open('rb') as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                  digest.update(chunk)
          if digest.hexdigest().lower() != expected_sha:
              raise SystemExit('source Delta asset SHA-256 mismatch')
          PY

      - name: Create or verify dedicated release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.select.outputs.tag }}
          VERSION: ${{ steps.select.outputs.version }}
          ASSET_NAME: ${{ steps.select.outputs.asset_name }}
          ASSET_SIZE: ${{ steps.select.outputs.asset_size }}
          ASSET_SHA256: ${{ steps.select.outputs.asset_sha256 }}
          SOURCE_RELEASE_URL: ${{ steps.select.outputs.source_release_url }}
        run: |
          set -euo pipefail
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/dedicated-release.json"
            python3 - "$RUNNER_TEMP/dedicated-release.json" "$ASSET_NAME" "$ASSET_SIZE" "$ASSET_SHA256" <<'PY'
          import json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          name, expected_size, expected_sha = sys.argv[2], int(sys.argv[3]), sys.argv[4].lower()
          matches = [asset for asset in release.get('assets', []) if asset.get('name') == name]
          if len(matches) != 1:
              raise SystemExit('existing dedicated release asset set differs from selected source')
          asset = matches[0]
          digest = str(asset.get('digest') or '').lower()
          if asset.get('size') != expected_size or digest != 'sha256:' + expected_sha:
              raise SystemExit('existing dedicated release asset digest/size mismatch')
          if release.get('draft') or release.get('prerelease'):
              raise SystemExit('existing dedicated Delta release is not stable')
          PY
          else
            gh release create "$TAG" "$ASSET_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Delta $VERSION" \
              --notes "Dedicated Delta mirror. Source: $SOURCE_RELEASE_URL. Source bytes verified by GitHub asset size + SHA-256 before upload."
          fi

      - name: Verify dedicated release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.select.outputs.tag }}
          ASSET_NAME: ${{ steps.select.outputs.asset_name }}
          ASSET_SIZE: ${{ steps.select.outputs.asset_size }}
          ASSET_SHA256: ${{ steps.select.outputs.asset_sha256 }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/dedicated-release.json"
          python3 - "$RUNNER_TEMP/dedicated-release.json" "$ASSET_NAME" "$ASSET_SIZE" "$ASSET_SHA256" <<'PY'
          import json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          name, expected_size, expected_sha = sys.argv[2], int(sys.argv[3]), sys.argv[4].lower()
          if release.get('draft') or release.get('prerelease'):
              raise SystemExit('dedicated release is not stable')
          matches = [asset for asset in release.get('assets', []) if asset.get('name') == name]
          if len(matches) != 1:
              raise SystemExit('dedicated release does not contain exactly one selected Delta asset')
          asset = matches[0]
          if asset.get('size') != expected_size:
              raise SystemExit('dedicated release size mismatch')
          if str(asset.get('digest') or '').lower() != 'sha256:' + expected_sha:
              raise SystemExit('dedicated release SHA-256 mismatch')
          print('DELTA_DEDICATED_RELEASE=' + str(release.get('html_url') or ''))
          print('DELTA_ASSET=' + name)
          print('DELTA_SHA256=' + expected_sha)
          PY
